name: Server deployment smoke

on:
  pull_request:
    branches: [main]
    paths:
      - deploy/**
      - server/**
      - contracts/**
      - client/encore_client/**
      - .github/workflows/deployment-smoke.yml
  push:
    branches: [main]
    paths:
      - deploy/**
      - server/**
      - contracts/**
      - client/encore_client/**
      - .github/workflows/deployment-smoke.yml

permissions:
  contents: read

jobs:
  compose-history:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check startup and readiness probes on the rendered Kubernetes configurations
        run: |
          set -euo pipefail
          for config in deploy/k8s deploy/k8s-history; do
            kubectl kustomize "$config" | ruby -ryaml -e '
              resources = YAML.load_stream(STDIN.read)
              deployment = resources.find { |r| r["kind"] == "Deployment" && r.dig("metadata", "name") == "encore-server" }
              server = deployment.fetch("spec").fetch("template").fetch("spec").fetch("containers").find { |c| c["name"] == "server" }
              {"startupProbe" => "/livez", "livenessProbe" => "/livez", "readinessProbe" => "/readyz"}.each do |probe, path|
                abort "#{probe} must use #{path}" unless server.dig(probe, "httpGet", "path") == path
              end'
          done
      - name: Build the fixture, retry a reaction, and read it after restart
        shell: bash
        run: |
          set -euo pipefail
          export ENCORE_TEST_DB_PASSWORD="$(openssl rand -hex 24)"
          compose=(docker compose -f deploy/compose.yaml -f deploy/compose.history.yaml)
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --build --wait --wait-timeout 90
          result=$("${compose[@]}" exec -T server python deploy/smoke.py)
          printf '%s\n' "$result"
          pc_result=$(python3 deploy/smoke.py --pc --server ws://127.0.0.1:8876)
          printf '%s\n' "$pc_result"
          "${compose[@]}" exec -T server sh -c 'test -w /var/lib/encore && test -s "$ENCORE_HISTORY_OUTBOX"'
          "${compose[@]}" stop history
          offline_result=$("${compose[@]}" exec -T server python deploy/smoke.py)
          printf '%s\n' "$offline_result"
          "${compose[@]}" stop server
          "${compose[@]}" up -d --wait --wait-timeout 90 history
          "${compose[@]}" up -d --no-deps --force-recreate --wait --wait-timeout 90 server
          "${compose[@]}" exec -T server sh -c 'test -s "$ENCORE_HISTORY_OUTBOX"'
          python3 - "$result" "$pc_result" "$offline_result" <<'PY'
          import json, sys, time
          from urllib.request import urlopen
          for raw in sys.argv[1:]:
              fixture = json.loads(raw)
              url = f"http://127.0.0.1:8876/v1/sessions/{fixture['session_id']}/events"
              deadline = time.monotonic() + 45
              while True:
                  with urlopen(url, timeout=10) as response:
                      events = json.load(response)["events"]
                  if [ev["event_id"] for ev in events] == fixture["final_event_ids"]:
                      break
                  if time.monotonic() >= deadline:
                      raise AssertionError(f"Expected {fixture['final_event_ids']} for {fixture['session_id']}; got {events}")
                  time.sleep(1)
              assert all(ev["phase"] == "FINAL" for ev in events), events
          PY
