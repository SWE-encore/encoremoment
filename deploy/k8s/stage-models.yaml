apiVersion: v1
kind: Pod
metadata:
  name: encore-stage-models
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    runAsGroup: 10001
    fsGroup: 10001
    seccompProfile: {type: RuntimeDefault}
  containers:
    - name: stage
      image: busybox:1.37
      command: [sleep, "1800"]
      securityContext:
        allowPrivilegeEscalation: false
        readOnlyRootFilesystem: true
        capabilities: {drop: [ALL]}
      volumeMounts: [{name: assets, mountPath: /bundle}]
  volumes:
    - name: assets
      persistentVolumeClaim: {claimName: encore-models}
