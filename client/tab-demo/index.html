<!doctype html>
<html lang="en">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Encore Moment Prototype</title>
<style>
:root{color-scheme:light;font:16px/1.5 system-ui,sans-serif;color:#152d32;background:#f7faf9}
body{max-width:1000px;margin:2rem auto;padding:0 1rem}h1{margin-bottom:.25rem}h2{font-size:1.1rem;margin:.6rem 0}
button,select{font:inherit;padding:.45rem .8rem;border:1px solid #9baead;border-radius:.45rem;background:white}
button:enabled{cursor:pointer}#start{background:#195e58;color:white}#stop{margin-left:.4rem}
section{background:white;border:1px solid #c8d7d4;border-radius:.7rem;padding:1rem}
main{display:grid;grid-template-columns:1fr 1fr;gap:1rem;margin:1rem 0}
video{display:block;width:100%;aspect-ratio:16/9;background:#142322;border-radius:.3rem}
[hidden]{display:none!important}
#signal{font-weight:700;padding:.7rem 1rem;border-left:5px solid #76908c;background:#e5eeec}
#signal[data-state=recording]{background:#ffe8df;border-color:#b03e1c}
#signal[data-state=saved]{background:#dff4e8;border-color:#247e51}
#log{font-size:.85rem;white-space:pre-wrap;overflow-wrap:anywhere}#clips{max-width:100%}
#face-input{width:160px;max-width:100%;vertical-align:middle}#roi{margin:0}
@media(max-width:720px){main{grid-template-columns:1fr}}
</style>
<h1>Encore Moment Prototype</h1>
<p>Start a session, choose your YouTube tab, and turn on tab audio sharing.</p>
<button id="start">Start session</button><button id="stop" disabled>End session</button>
<p id="signal" role="status">Ready to start</p>
<main>
<section><h2>Shared tab</h2><video id="preview" autoplay muted playsinline></video>
<p id="scores">Laughter — · Smile —</p><p id="faces">Waiting for face detection</p>
<figure id="roi" hidden><canvas id="face-input" width="320" height="180"></canvas> <small id="roi-name"></small></figure>
<small id="peaks"></small><p id="rule"></p></section>
<section><h2>Saved clips <small id="saved-count"></small></h2><p id="clip-progress" role="status"></p>
<video id="early" controls muted playsinline hidden></video>
<div id="empty"><p>No clips saved at this address yet.</p><a id="other-origin"></a></div>
<div id="saved" hidden>
<video id="player" controls playsinline></video>
<small id="playback" role="status"></small>
<p><select id="clips" aria-label="Select a saved clip"></select></p>
<a id="download">Download WebM</a>
</div></section>
</main>
<details><summary>Server event log</summary><pre id="log"></pre></details>
<script type="module" src="tab.js?v=7"></script>
</html>
