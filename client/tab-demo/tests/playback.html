<!doctype html><html lang="en"><meta charset="utf-8"><title>Local recorder playback test</title>
<label><input type="checkbox" id="resize">Resize video during recording</label>
<button id="run">Run recording test</button><pre id="result"></pre>
<canvas width="96" height="64"></canvas><video muted playsinline></video>
<script type="module">
import {ClipBuffer} from "../clips/buffer.js";
import {savedClips} from "../clips/store.js";
const wait = ms => new Promise(r => setTimeout(r,ms));
const out = document.querySelector("#result");
document.querySelector("#run").onclick = async function () {
  this.disabled = true;
  const root = await navigator.storage.getDirectory();
  const temp = "encore-test-" + crypto.randomUUID();
  const dir = await root.getDirectoryHandle(temp,{create:true});
  const canvas = document.querySelector("canvas");
  canvas.width = 96;
  const ctx = canvas.getContext("2d");
  const video = document.querySelector("video");
  const audio = new AudioContext(), osc = audio.createOscillator(), dest = audio.createMediaStreamDestination();
  const stream = canvas.captureStream(12);
  stream.addTrack(dest.stream.getAudioTracks()[0]);
  const timer = setInterval(() => {ctx.fillStyle = Math.floor(performance.now()/100)%2 ? "green" : "blue";ctx.fillRect(0,0,96,64);},70);
  const resize = document.querySelector("#resize").checked;
  let recorder,url;
  try {
    await audio.resume();
    osc.connect(dest); osc.start();
    let error, saved = [], phases = [], preview;
    recorder = new ClipBuffer(stream,dir,{onPreview:b=>{preview=b;},onSaved:c=>saved.push(c),onSignal:p=>phases.push(p),onError:e=>{error=e;}});
    out.textContent = "Capturing synthetic video and audio";
    await wait(5000); // exercise a complete rotation and pre-event footage
    const event = {event_id:"evt-0001",reaction:{type:"laughter"},generations:{camera:1},capture:{triggers_ms:[Math.round(performance.now())],end_ms:null}};
    recorder.receive({...event,phase:"OPEN",revision:1});
    recorder.receive({...event,phase:"OPEN",revision:1});
    recorder.receive({...event,phase:"UPDATE",revision:2});
    for(let i=0;i<60 && !preview && !error;i++) await wait(100);
    if(!preview?.size || saved.length || !recorder.active) throw Error("missing preview while recording");
    if (resize) canvas.width = 128;
    event.capture.end_ms=performance.now();
    recorder.receive({...event,phase:"FINAL",revision:3});
    for(let i=0;i<260 && !saved.length && !error;i++) await wait(100);
    const autoSaved = saved.length;
    await recorder.stop();
    if (error) throw error;
    const expected = resize ? 2 : 1;
    if (autoSaved!==expected || phases.join()!=="OPEN,UPDATE,FINAL") throw Error("incorrect event lifecycle");
    const clips = await savedClips(dir);
    if (clips.length!==expected) throw Error("saved clip missing");
    for await (const name of dir.keys()) if(/^(buffer-|ring-|export-)/.test(name)) throw Error("unused recording still present");
    if (clips[0].meta.status !== "partial" || !clips[0].meta.gaps.length) throw Error("missing activation gap");
    let bytes = 0;
    for (const [i, clip] of clips.entries()) {
      const file = await clip.handle.getFile();
      bytes += file.size;
      if (clip.meta.file_index !== i+1 || clip.meta.file_count !== expected) throw Error("incorrect file order");
      if (i && clip.meta.media_start_ms !== clips[i-1].meta.media_end_ms) throw Error("lost recording at split");
      const header = new TextDecoder().decode(await file.slice(0,8192).arrayBuffer());
      if (!header.includes("V_VP8") || !header.includes("A_OPUS")) throw Error("missing audio or video track");
      video.src = url = URL.createObjectURL(file);
      await video.play();
      if (video.videoWidth !== (i ? 128 : 96)) throw Error("incorrect saved resolution");
      const target = Math.min(7, video.duration / 2);
      video.currentTime = target;
      await wait(1200);
      if (video.currentTime <= target || video.error) throw Error("playback failed across segment boundary");
      URL.revokeObjectURL(url); url = null;
    }
    out.textContent = "PASS · " + expected + " file(s) · " + bytes + " bytes · VP8 + Opus · " + phases.join(" → ");
  } catch (e) {out.textContent="FAIL · "+e;}
  finally {
    if (recorder && !recorder.closed) await recorder.stop();
    clearInterval(timer); stream.getTracks().forEach(t=>t.stop()); await audio.close();
    if(url) URL.revokeObjectURL(url);
    await root.removeEntry(temp,{recursive:true}); this.disabled=false;
  }
};
</script></html>
